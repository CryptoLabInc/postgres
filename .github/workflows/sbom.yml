name: SBOM & Vulnerability Scan

on:
  push:
    branches: ["release/*"]
  pull_request:
    branches: ["release/*"]
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t postgres:local -f 16/trixie/Dockerfile 16/trixie/

      - name: Smoke test (root start steps down to postgres)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=x postgres:local
          for i in $(seq 30); do docker exec pg pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec pg pg_isready -h 127.0.0.1 -U postgres
          test "$(docker exec pg stat -c %u /proc/1)" = 999

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: postgres:local
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-postgres
          path: sbom.cdx.json
          retention-days: 90

      - name: Scan vulnerabilities (Grype)
        uses: anchore/scan-action@v6
        with:
          image: postgres:local
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
